# Secrets (APP_KEY, TELEGRAM_*, ADMIN_*) are read by Laravel from the bind-mounted .env, never from this file.
x-app-env: &app-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: internship
  DB_USERNAME: internship
  DB_PASSWORD: internship
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  environment: *app-env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: internship
      POSTGRES_USER: internship
      POSTGRES_PASSWORD: internship
    ports:
      - "5434:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d/app:ro
      - ./docker/postgres/00-app-init.sh:/docker-entrypoint-initdb.d/00-app-init.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship -d internship"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Telegram notifications and CSV exports. --timeout stays below REDIS_QUEUE_RETRY_AFTER (660 s).
  queue:
    <<: *app
    command: php artisan queue:work redis --sleep=1 --tries=3 --backoff=10 --timeout=620 --max-time=3600
    stop_grace_period: 30s

  # Invite expiry, assignment activation, midnight INCOMPLETE job, pruning.
  scheduler:
    <<: *app
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres:
  redis:
